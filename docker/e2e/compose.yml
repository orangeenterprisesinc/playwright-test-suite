# Containerized PET Tiger E2E stack.
#
# The database is PULLED, not restored: ghcr.io/orangeenterprisesinc/pet-tiger-testdb
# ships TigerMaster + PetData already inside the image layer (PET-12460). That is
# what replaced the old host SQL Server Express rig and the 12.9GB DelLlano.bak —
# this stack now reproduces on any machine with Docker and a GHCR login.
#
# Bring-up order matters; see docker/e2e/README.md. Short version:
#   npm run e2e:stack:db        # pull + start the DB
#   (host) go run ./cmd/migrate up --target all
#   npm run e2e:stack:repoint   # ClientMaster -> sqlserver, extend licence
#   npm run e2e:stack:app
#   npm run e2e:stack:webpet
#
# WEBPET_DIR (docker/e2e/.env) points at the web-pet checkout used to build the
# api/web images. Copy .env.example to .env and fill it in.

name: pet-tiger-e2e

services:
  # ── SQL Server, pre-baked with TigerMaster + PetData ────────────────────────
  sqlserver:
    image: ${PT_TESTDB_IMAGE}
    environment:
      ACCEPT_EULA: "Y"
      # The three PT_TESTDB_* passwords below are committed literals on purpose
      # (PET-12460): the image's repair scripts create the logins and write the
      # app password INTO the databases before the image is baked, so a
      # per-machine secret could never match a pulled image. The container is
      # disposable, bound to localhost, and holds only test data. The ${VAR:-}
      # form is an override hook for when a future image changes them.
      #
      # Must equal the password baked into the image's master DB. This variable
      # only takes effect on first init of an EMPTY data dir; here the databases
      # already exist, so a different value is ignored and every subsequent
      # login fails with "Login failed for user 'sa'".
      MSSQL_SA_PASSWORD: "${PT_TESTDB_SA_PASSWORD:-Pet-Tiger-Test-1x}"
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: "${PT_TESTDB_MEMORY_MB:-3072}"
    ports:
      # Host-side access for cmd/migrate and GUI clients: localhost,14333.
      # Deliberately not 1433 — a stale MSSQL_PORT then cannot reach a real instance.
      - "${PT_TESTDB_PORT:-14333}:1433"
    # No named volume on /var/opt/mssql. The databases live in the image layer,
    # and Docker seeds a named volume from image content only when the volume is
    # brand new — an existing pet-tiger-e2e_mssql_data would MASK them and leave
    # you with an empty server that still reports healthy.
    healthcheck:
      # A QUERY, not a port probe. SQL Server accepts TCP several seconds before
      # it has finished recovering the databases, so "port open" would hand the
      # suite a server it cannot yet use — flaky in a way that reads like a test
      # bug. The image ships sqlcmd, so this needs nothing on the host.
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost",
             "-U", "pt_test", "-P", "PetTigerTest1!", "-C", "-Q", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ── One-shot: fixups the standalone-built image cannot carry ────────────────
  db-repoint:
    # Same image as the server: it ships /opt/mssql-tools18/bin/sqlcmd, so this
    # pulls nothing extra.
    image: ${PT_TESTDB_IMAGE}
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      PT_PASSWORD: "${PT_TESTDB_APP_PASSWORD:-PetTigerTest1!}"
    volumes:
      - ./repoint.sh:/repoint.sh:ro
    entrypoint: ["/usr/bin/env", "bash", "/repoint.sh"]
    restart: "no"

  # ── MinIO (S3) + bucket init + Gotenberg (PDF) ──────────────────────────────
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      # Published so a host-side `npm test` can reach S3 too, not just the
      # in-network tests service (employee-documents.spec.ts gates on S3_ENDPOINT).
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/pet-tiger-dev &&
        echo 'Bucket pet-tiger-dev ready.'
      "
    restart: "no"

  gotenberg:
    image: gotenberg/gotenberg:8
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── App API (Go) — built from web-pet ───────────────────────────────────────
  api:
    build:
      context: "${WEBPET_DIR}/apps/api"
      dockerfile: Dockerfile
    environment:
      API_PORT: "8080"
      MSSQL_SERVER: sqlserver
      MSSQL_PORT: "1433"
      MSSQL_DB: PetData             # ClientMaster.DatabaseName in the pulled image
      MSSQL_USER: pt_test           # the image's app login; sa is bootstrap-only
      MSSQL_PASSWORD: "${PT_TESTDB_APP_PASSWORD:-PetTigerTest1!}"
      MSSQL_ENCRYPT: "false"
      MSSQL_TRUST_SERVER_CERTIFICATE: "true"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: pet-tiger-dev
      S3_ACCESS_KEY: minioadmin
      S3_SECRET: minioadmin
      S3_USE_PATH_STYLE: "true"
      GOTENBERG_URL: http://gotenberg:3000
      PT_ALLOWED_ORIGINS: "http://localhost:8090,http://web"
      # Quieten the import/export workers (they spewed S3 404s in earlier runs)
      PT_IMPORT_WORKER_DISABLED: "true"
      PT_EXPORT_WORKER_DISABLED: "true"
      PT_EXPORT_SCHEDULER_DISABLED: "true"
    depends_on:
      sqlserver:
        condition: service_healthy
      minio:
        condition: service_healthy
      gotenberg:
        condition: service_healthy

  # ── App web (Caddy :80, serves SPA + proxies /api to api:8080) ──────────────
  web:
    build:
      context: "${WEBPET_DIR}"
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_started
    ports:
      - "8090:80"     # host:8090 for manual poke; tests hit http://web inside the net

  # ── Playwright suite — built from THIS repo (Ubuntu Noble base) ─────────────
  tests:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    # run-playwright.js, not bare `npx playwright test`: it is what exports
    # WEBPET=1 when --project=webpet is passed, and workers re-read the config
    # with a different argv, so the flag alone is not enough.
    entrypoint: ["node", "scripts/run-playwright.js", "local"]
    environment:
      TEST_ENV: local
      BASE_URL: http://web
      API_URL: http://web/api
      USER_NAME: su
      PASSWORD: "${PT_TESTDB_E2E_PASSWORD:-PetTigerE2E1!}"
      E2E_ADMIN_USER: su
      E2E_ADMIN_PASSWORD: "${PT_TESTDB_E2E_PASSWORD:-PetTigerE2E1!}"
      S3_ENDPOINT: http://minio:9000
      TEST_DATA_SOURCE: json
      CI: "true"
      # WEBPET_NONSU_* intentionally unset: PetData.dbo.Users holds only
      # aa/Su/ab/ac, so the non-SU specs should skip, not fail on a bad login.
    volumes:
      # One mount for the whole output tree (html/, results/, allure/, logs/).
      - ../../artifacts:/app/artifacts
    depends_on:
      web:
        condition: service_started

volumes:
  minio_data:
