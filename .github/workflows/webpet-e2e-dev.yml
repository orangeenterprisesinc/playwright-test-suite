name: WebPet E2E (dev staging)

# Runs the MIGRATED web-pet suite (tests/webpet — 406 tests) against the DEV
# STAGING deployment (app.ptdev.xyz). Boots nothing; TEST_ENV=dev makes the
# framework's env loading supply BASE_URL/API_URL, and .env.dev additionally
# sets WEBPET_API_ORIGIN=https://api.ptdev.xyz so the suite's direct API calls
# (admin login, data-factory) target the API host — the SPA host serves
# index.html for every path including /api/*.
#
# ── REPORT-ONLY BASELINE — read before treating red as regression ───────────
# This suite was authored against a seeded local DelLlano DB. On dev staging:
#   * pass counts WILL differ from the localhost baseline (362/18/26) wherever
#     dev's data differs from the seed;
#   * the suite MUTATES dev data by design (creates test crews/employees/jobs,
#     inline-edits Ranch/Field rows, provisions a RestrictedTest_* user,
#     changes user preferences) — accepted per the migration decision;
#   * expected dev-failure classes (cannot be fixed without invasive edits):
#       - specs calling page.request.*('/api/…') — that context inherits the
#         SPA host's baseURL and gets index.html back (ranch, job, parts of
#         notifications, and 3 equiv specs);
#       - employee-documents.spec.ts skips (S3_ENDPOINT deliberately unset);
#       - data-scoping depends on RestrictedTest provisioning against dev.
# Capture the first runs as the dev baseline (tests/webpet/README.md) and
# disable dev-incompatible tests via src/data/webpet/webpetRunnerManager.json.
#
# Nightly + manual only — deliberately NOT on push and NOT on the
# run-playwright repository_dispatch (e2e.yml owns those for dev staging).
on:
  schedule:
    # 4:00 AM IST (UTC+5:30) — clear of e2e.yml's 10:30/12:30 UTC slots and
    # webpet-e2e-local.yml's 20:30 UTC slot.
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      grep:
        description: 'Only run webpet tests matching this pattern (e.g. employee, "Billing Center"). Blank = whole suite.'
        required: false
        default: ''
      batch:
        description: 'Conversion batch number, e.g. 01 — runs only @WPBatch<NN>. Takes precedence over grep. Blank = whole suite.'
        required: false
        default: ''
      workers:
        description: 'Playwright workers. Leave at 1 for a baseline-comparable run; raise only for a quick smoke (results then are NOT comparable).'
        required: false
        default: '1'

concurrency:
  group: webpet-e2e-dev
  cancel-in-progress: true

jobs:
  webpet-e2e-dev:
    name: WebPet Playwright E2E (dev staging)
    runs-on: ubuntu-latest
    # A serial run of the whole suite took 56.5 min on dev (see
    # tests/webpet/DEV-BASELINE-2026-07-29.md); with ~5 min of setup that is ~62,
    # so 75 left almost no headroom for a slow night. 90 does.
    timeout-minutes: 90

    env:
      # Selects .env.dev (BASE_URL=https://app.ptdev.xyz, API_URL and
      # WEBPET_API_ORIGIN=https://api.ptdev.xyz). See e2e.yml for why
      # USER_NAME is a variable (masking) and why the 'su' default is required.
      TEST_ENV: dev
      USER_NAME: ${{ vars.DEV_USER_NAME || 'su' }}
      PASSWORD: ${{ secrets.DEV_PASSWORD }}
      # The migrated suite's admin login (tests/webpet/support/provision.ts and
      # notifications.spec.ts read these directly) — same dev-staging account.
      E2E_ADMIN_USER: ${{ vars.DEV_USER_NAME || 'su' }}
      E2E_ADMIN_PASSWORD: ${{ secrets.DEV_PASSWORD }}
      # Materializes the webpet projects in every process (runner + workers).
      WEBPET: '1'
      # No DB_* here: the webpet suite does its own API-level cleanup and the
      # framework's SQL sweep targets 'QA User %' rows this suite never creates.
      # With DB_SERVER/DB_CLIENT unset, isDbCleanupEnabled() is false and the
      # global-setup probe just logs a warning.
      SEND_EMAIL: ${{ vars.SEND_EMAIL || 'no' }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      SEND_SLACK: ${{ vars.SEND_SLACK || 'no' }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      # Fail in seconds with the actual cause instead of a login timeout later.
      - name: "Guard: login password secret present"
        run: |
          if [ -z "$PASSWORD" ]; then
            echo "::error::No login password configured — add a DEV_PASSWORD repository secret holding the dev-staging 'su' password. Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Checkout test suite
        uses: actions/checkout@v4
        with:
          # Full history + tags — the relocation audit reads each spec's
          # pre-conversion form out of the webpet-lift-v1 tag, which a shallow
          # clone does not fetch.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java (for Allure report generation)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install test-suite deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # BLOCKING. Static analysis only (no app, no discovery): catches a spec
      # importing base.fixture — which would skip all 406 while reporting green
      # — plus orphaned/duplicate WP ids, drifted id maps and leaked journey
      # tags. None of those show up in a pass/fail column.
      - name: Validate webpet ids and imports
        run: |
          npm run typecheck
          npm run lint
          npm run webpet:ids:check

      # Relocation gate — see webpet-e2e-local.yml for the rationale. Skipped
      # rather than failed when the tag is absent (shallow clone).
      - name: Validate webpet locator relocation
        run: |
          if git rev-parse --verify webpet-lift-v1 >/dev/null 2>&1; then
            npm run webpet:audit
          else
            echo "::warning::webpet-lift-v1 tag not fetched — relocation audit skipped."
          fi

      # Blocking since Batch 15 (see webpet-e2e-local.yml for the full rationale):
      # the gate is fail-open, so a test with no runner row skips silently while
      # the run still reports green. With all 406 annotated and 0 rows structural,
      # any drift here is a real defect, not conversion churn.
      - name: Validate webpet runner data
        run: npm run webpet:runner:check

      # NOTE: no --reporter override — that would REPLACE the configured chain
      # and empty the html/allure artifacts uploaded below. The chain's JSON
      # reporter already writes artifacts/results/results.json for the diff.
      # --workers is pinned, NOT left to the config's default of 4. This suite is
      # not parallel-safe on dev: it mutates shared dev data (test crews,
      # employees, jobs, Ranch/Field inline edits, user preferences), so
      # concurrent tests race each other. The committed baseline was captured at
      # workers 1, and a run at any other width is not comparable with it — the
      # first CI run after the framework alignment landed at 4 and finished in
      # 6m11s against the baseline's 56.5m, with a failure set that matched
      # per-file but could not be trusted to match per-test.
      #
      # `workers` is a dispatch input so a quick smoke is still one click away;
      # the scheduled nightly always runs serial.
      - name: Run webpet Playwright tests
        env:
          GREP: ${{ github.event.inputs.grep }}
          BATCH: ${{ github.event.inputs.batch }}
          WORKERS: ${{ github.event.inputs.workers }}
        run: |
          FILTER="$GREP"
          if [ -n "$BATCH" ]; then FILTER="@WPBatch$BATCH"; fi
          # Empty on a scheduled run (dispatch inputs are unset there) → serial.
          W="${WORKERS:-1}"
          if [ -z "$W" ]; then W=1; fi
          if [ "$W" != "1" ]; then
            echo "::warning::Running with $W workers — results are NOT comparable with the committed dev baseline (captured at 1)."
          fi
          echo "Workers: $W"
          if [ -n "$FILTER" ]; then
            echo "Filtering to: $FILTER"
            npx playwright test --project=webpet --workers="$W" --grep "$FILTER"
          else
            npx playwright test --project=webpet --workers="$W"
          fi

      # Report-only: dev is a triage baseline, not a gate (its DB is not the
      # seeded DelLlano and the suite mutates dev data), so a delta here is
      # information rather than a failure.
      - name: Diff against the committed dev baseline
        if: always()
        continue-on-error: true
        run: |
          if [ -f src/data/webpet/baselines/dev.json ] && [ -f artifacts/results/results.json ]; then
            npm run webpet:diff -- src/data/webpet/baselines/dev.json artifacts/results/results.json
          else
            echo "::warning::No dev baseline manifest yet — see tests/webpet/README.md 'Baselines'."
          fi

      - name: Restore Allure history
        if: always()
        uses: actions/cache@v4
        with:
          path: artifacts/allure/report/history
          key: webpet-allure-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            webpet-allure-history-${{ github.ref_name }}-

      - name: Generate Allure report
        if: always()
        run: node scripts/report/allure-generate.js

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webpet-playwright-report
          path: artifacts/html

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webpet-allure-report
          path: artifacts/allure/report
