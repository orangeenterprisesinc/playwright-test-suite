name: Claude code review

# Posts an automated review on every non-draft PR to main: inline comments on
# specific lines plus one summary comment. It is advisory — a human still
# reviews and merges (.claude/GITHUB_WORKFLOW.md) — and it runs no tests; CI
# for the suite itself stays in e2e.yml.
#
# Needs the ANTHROPIC_API_KEY repository secret (or the Claude GitHub App via
# `/install-github-app`). Until a repo admin adds it, this job fails at the
# action step; that is a setup gap, not a code failure.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Review PR
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md first; it points at the
            orchestration rules and the two domain profiles
            (.claude/profiles/WEBPET.md for tests/webpet/ and src/**/webpet/,
            .claude/profiles/JOURNEY.md for tests/web/, src/data/runner/,
            src/data/catalog/, test-plans/). Read only the profile(s) the diff
            touches, and the skills under .claude/skills/ the diff falls under.

            Focus on correctness first, then this repo's conventions:
            - Specs: correct fixture import, legal tags for the suite, a
              testCaseId annotation, assertions that check the expected
              behavior rather than "page rendered" (pw-spec-author).
            - Locators: no .nth()/.first() papering over ambiguity, no CSS/XPath
              chains where a role/label locator works, no fixed waits or raised
              timeouts used to go green (pw-locator-hardening).
            - tests/web/**: workflow steps happen on screen; any API write is
              wrapped in allowApiWrites(...) under one of the four allowances,
              and `arrange` appears only in the files the workflow lists.
            - Runner data changes go through the .csv, not the generated .json.
            - Parallel safety: run-unique names, no cross-spec ordering.
            - Changes to .claude/agents/*.md are flagged unless the PR says a
              human asked for them.

            Post findings as inline comments with
            mcp__github_inline_comment__create_inline_comment (one issue per
            comment, say why it matters and how to fix it). Then post one short
            summary with `gh pr comment`. Do not comment on style a linter
            already enforces, and do not restate the diff. If there is nothing
            worth raising, say so in the summary.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
