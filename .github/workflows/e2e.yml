name: E2E

# Runs a Playwright suite against the DEV STAGING deployment (app.ptdev.xyz).
# No app is booted here — TEST_ENV=dev is pinned in the job env below, so the
# framework's env loading (.env.dev + .env — see src/config/envLoader.ts) supplies
# BASE_URL/API_URL and USER_NAME, and the DEV_PASSWORD secret supplies the
# login password (dev-staging only — see the env block for why there is no
# fallback to a generic PASSWORD secret).
#
# Pinning TEST_ENV is load-bearing: without it envLoader falls back to 'local'
# and loads .env.local, pointing the suite at http://localhost:3000 on a
# GitHub-hosted runner where nothing is listening.
#
# ── ONE WORKFLOW, TWO SUITES ────────────────────────────────────────────────
# The `suite` input selects which:
#
#   journey (default) — tests/web + tests/api, the user-journey suite. A bare
#                       `npx playwright test` is already exactly this: tests/webpet
#                       is opt-in behind WEBPET=1 / --project=webpet, so it is
#                       excluded without any filtering.
#   webpet            — the migrated web-pet suite (tests/webpet, 406 tests),
#                       serial by default and with its own validation gates.
#
# Everything the two suites disagree on — timeout, WEBPET/DB env, checkout depth,
# validation steps, test command, S3 prefix, artifact names — is switched on that
# one value, which reaches the job as `matrix.suite`.
#
# The 4 PM IST cron runs BOTH, one after the other (`max-parallel: 1`): they hit
# the same dev-staging data and the webpet suite mutates it, so they must never
# overlap. A dispatch can ask for the same pair with suite=both; push and
# repository_dispatch always run journey alone.
#
# ── WEBPET IS A REPORT-ONLY BASELINE — read before treating red as regression ─
# That suite was authored against a seeded local DelLlano DB, so on dev staging
# pass counts differ from the localhost baseline, the suite MUTATES dev data by
# design, and several failure classes are expected and unfixable without invasive
# edits (specs calling page.request.*('/api/…') get the SPA host; employee
# documents skip on unset S3_ENDPOINT; data-scoping needs RestrictedTest
# provisioning). Full list and the baseline procedure: tests/webpet/README.md.
#
# Need to run against a real localhost instead? See e2e-local.yml (journey) and
# webpet-e2e-local.yml (webpet), which build the app from a web-pet source
# checkout on a self-hosted Windows runner.
#
# This file must live on `main`: GitHub only fires `schedule:` from the default
# branch, so a cron block on any other branch is accepted and then never triggers.
# A scheduled run therefore tests main. `dry-run` is kept in step with main rather
# than being pinned as the code under test, which is what the removed
# `ref: dry-run` / BRANCH_OVERRIDE pair used to arrange.
on:
  schedule:
    # The daily dry run, ~4:00 PM IST (IST is UTC+5:30; cron is always UTC). Set a
    # couple of minutes early and deliberately off :00 and :30 — those are the most
    # contended minutes on GitHub's scheduler, and a run asked for at exactly 4:00
    # once landed at 4:21. Scheduled runs are best-effort; expect some slip.
    #
    # On this event the matrix below runs BOTH suites, one after the other.
    - cron: '28 10 * * *'
  # push and repository_dispatch always run the journey suite: `inputs` is null on
  # those events, so the matrix expression falls through to journey.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which suite to run. `both` mirrors the 4 PM cron (journey then webpet, serial).'
        type: choice
        required: false
        default: journey
        options: [journey, webpet, both]
      grep:
        description: 'Only run tests matching this tag/pattern (journey: @JourneyA, @A1, @Smoke — webpet: employee, "Billing Center"). Blank = whole suite.'
        required: false
        default: ''
      scope:
        description: 'journey only. Customer scope from config/scopes/ (e.g. anthony-vineyards). Blank = no segment/module filtering.'
        required: false
        default: ''
      batch:
        description: 'webpet only. Conversion batch number, e.g. 01 — runs only @WPBatch<NN>. Takes precedence over grep.'
        required: false
        default: ''
      workers:
        description: 'webpet only. Defaults to 2. Set 1 for a baseline-comparable run — the committed dev baseline only holds serially.'
        required: false
        default: '2'
      run_label:
        description: 'Overrides the Slack "how was this run started" label — a cross-repo dispatcher names its origin here (e.g. web-pet PR #566). Blank = derived from the trigger.'
        required: false
        default: ''
  # Reusable, so an orchestrator could drive this once per suite. Nothing calls it
  # today — the cron above runs both suites itself. Kept because a caller inherits
  # this workflow's triggering event, which is what would keep the Slack gate in
  # src/reporting/deliver/slack/gate.ts satisfied for an orchestrated run.
  workflow_call:
    inputs:
      suite:
        description: 'journey (default) or webpet.'
        type: string
        required: false
        default: journey
      grep:
        type: string
        required: false
        default: ''
      scope:
        type: string
        required: false
        default: ''
      batch:
        type: string
        required: false
        default: ''
      workers:
        type: string
        required: false
        default: '1'
      suite_name:
        description: 'Overrides the Slack report header. Blank = derived from `suite`.'
        type: string
        required: false
        default: ''
      run_label:
        description: 'Overrides the Slack execution label — see the workflow_dispatch input of the same name.'
        type: string
        required: false
        default: ''
  # Must match the `event_type` the sending repo's workflow actually posts
  # (its "Trigger Automation Repository" step sends {"event_type":"run-playwright"}
  # to POST /repos/orangeenterprisesinc/playwright-test-suite/dispatches) — a
  # mismatch here means GitHub accepts the dispatch but nothing fires, silently.
  repository_dispatch:
    types:
      - run-playwright

# `github.workflow` is the CALLER's name inside a reusable workflow, so it keeps an
# orchestrated run and a direct push/dispatch in separate groups.
# `github.event_name` is in the group so a push to main cannot cancel the 4 PM run
# mid-suite — they would otherwise share `refs/heads/main` and the nightly WebPet
# leg runs for over an hour. Both matrix legs belong to one run, so they share this
# group harmlessly.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.suite == 'webpet' && 'WebPet Playwright E2E (dev staging)' || 'Playwright E2E' }}
    runs-on: ubuntu-latest

    strategy:
      # NEVER parallel. Both suites target the same dev-staging data and the webpet
      # suite mutates it, so concurrent legs would race each other.
      max-parallel: 1
      # The two suites are independent: a red journey run must not cancel WebPet
      # before it starts. This replaces the `if: always()` the old orchestrator had.
      fail-fast: false
      matrix:
        # Cron — and a dispatch that asked for `both` — run the whole dry run;
        # every other trigger runs one suite, the one a dispatch selected, or
        # journey for push/repository_dispatch where `inputs` is null (so
        # `inputs.suite == 'both'` is simply false there).
        suite: ${{ fromJSON((github.event_name == 'schedule' || inputs.suite == 'both') && '["journey","webpet"]' || format('["{0}"]', inputs.suite || 'journey')) }}
    # A serial webpet run of the whole suite took 56.5 min on dev (see
    # tests/webpet/DEV-BASELINE-2026-07-29.md); with ~5 min of setup that is ~62,
    # so 75 left almost no headroom for a slow night. 90 does. The journey suite
    # runs in a couple of minutes, but 15 left it almost no slack: against ~5 min
    # of setup, a slow install alone cancelled the job before any test ran
    # (2026-08-19). 30 absorbs a slow npm ci or install retry while still failing
    # fast on a real hang.
    timeout-minutes: ${{ matrix.suite == 'webpet' && 90 || 30 }}

    env:
      # Selects .env.dev (BASE_URL=https://app.ptdev.xyz,
      # API_URL=https://api.ptdev.xyz/api — the API is a separate host from the
      # static SPA — plus WEBPET_API_ORIGIN for the webpet suite's direct API
      # calls, since the SPA host serves index.html for every path including
      # /api/*). Applies to every trigger above, so the repository_dispatch the
      # app repo fires also targets dev staging; localhost coverage lives in
      # e2e-local.yml.
      TEST_ENV: dev
      # USER_NAME comes from the DEV_USER_NAME repository *variable*, not a
      # secret. A login name is not a credential, and Actions masks every literal
      # occurrence of a secret's value — so storing a short value like 'su' as a
      # secret mangles unrelated words throughout the log (playwright-test-***ite,
      # allure-re***lts, Report ***ccessfully). Variables are not masked, so the
      # log stays readable. Set DEV_USER_NAME when dev staging's account changes;
      # leave it unset and the default below applies.
      #
      # The 'su' default is required, NOT redundant with .env.dev's USER_NAME=su:
      # Actions exports a job-level env entry even when the expression resolves
      # empty, and envLoader only defers to the file value when the OS variable is
      # undefined — not when it is '' (src/config/envLoader.ts:98). Keep this
      # default in sync with .env.dev.
      USER_NAME: ${{ vars.DEV_USER_NAME || 'su' }}
      #
      # DEV_PASSWORD is dev-staging only, with NO fallback — mirroring
      # LOCAL_PASSWORD in e2e-local.yml so the two environments stay visibly
      # separate. The previous `PW_PASSWORD || PASSWORD` chain silently picked up
      # a stale localhost PASSWORD secret and authenticated against the wrong
      # environment, which surfaced only as an opaque 20s waitForURL timeout in
      # auth-setup. An unset secret must fail loudly (see the guard step below)
      # rather than log in as somewhere else.
      PASSWORD: ${{ secrets.DEV_PASSWORD }}
      # The webpet suite's admin login (tests/webpet/support/provision.ts and
      # notifications.spec.ts read these directly) — same dev-staging account.
      # Harmless for the journey suite, which never reads them.
      E2E_ADMIN_USER: ${{ vars.DEV_USER_NAME || 'su' }}
      E2E_ADMIN_PASSWORD: ${{ secrets.DEV_PASSWORD }}
      # Real non-SU login for the WEBPET-2006 escape-hatch test (WP-0408,
      # employee.spec.ts). Unset secrets are fine: the test self-skips.
      WEBPET_NONSU_USER: ${{ secrets.WEBPET_NONSU_USER }}
      WEBPET_NONSU_PASSWORD: ${{ secrets.WEBPET_NONSU_PASSWORD }}
      # Scan-time-in equivalence (WP-0178, equiv/scan-time-in-equivalence.spec.ts):
      # deliberately env-gated so no employee barcode lives in the repo. Unset
      # vars are fine: the test self-skips. Set SCAN_EMPLOYEE_BARCODE to an
      # active employee code that POST /scan/decode resolves on dev.
      SCAN_TIME_IN_EQUIV: ${{ vars.SCAN_TIME_IN_EQUIV }}
      SCAN_EMPLOYEE_BARCODE: ${{ vars.SCAN_EMPLOYEE_BARCODE }}
      # Materializes the webpet projects in every process (runner + workers).
      # Empty for the journey suite, which is what keeps tests/webpet out of it.
      WEBPET: ${{ matrix.suite == 'webpet' && '1' || '' }}
      # --- Journey B device→office import (B1-001, B2-001) ----------------------
      # Which route carries the device export into the office. `internet` is
      # Connectivity ▸ Import ▸ Internet — the relay pull Amy's recordings show,
      # and the code default. The relay gates that used to block it on dev are
      # open (WEBPET-2222: WEBMAIL_LIVE_SEND_ENABLED set per PET-12482, and the
      # ClientRelayRegistration row exists with LiveSendEnabled=1); the relay
      # round-trip spec (B1-002) passes against the v6 endpoint.
      #
      # Known dependency: the office mailbox (DEVICE_RELAY_SERVER) must not be
      # shared with any other importer. A second consumer on the same mailbox
      # steals fresh envelopes before Trigger Import can pull them and the specs
      # fail with "No new files were waiting on the relay" — seen on dev
      # 2026-08-21, tracked on WEBPET-2222. If that recurs, the fallback is to
      # set this back to 'single-folder', which posts the same envelope straight
      # to the importer and exercises identical office-side assertions.
      IMPORT_TRANSPORT: 'internet'
      # The worker claims queued files on the client's SrvcRealTimeImportInterval
      # cadence (minutes — GET /api/preferences → serviceImportInterval), NOT on
      # arrival. Dev was 15 min and is now 1, so the 60s default is too tight to
      # be reliable; this rides out a slow tick without hiding a real stall.
      IMPORT_POLL_TIMEOUT_MS: '180000'
      # OFFICE_TRANSPORT_SUBSTITUTE is deliberately NOT set: it would create the
      # punches through the office API when the import fails, turning a broken
      # pipeline green. Keep it unset so CI only passes on a real import.
      # -------------------------------------------------------------------------
      # No DB_* env. Test-data cleanup goes through the app's API using the session
      # auth-setup already established, so it needs no database access at all — dev
      # staging's SQL Server is VPC-private and opening it to GitHub's runner IP
      # ranges was rejected on security grounds (WEBPET-1606). The DB_SERVER /
      # DB_CLIENT / DB_USER / DB_PASSWORD secrets and vars are now unused and can be
      # deleted from the repo settings.
      # No BRANCH_OVERRIDE. It existed because a scheduled run had to check out
      # `dry-run` while cron fired from `main`, so the reports would otherwise have
      # named the wrong branch. main and dry-run now hold the same code and the
      # scheduled run tests main directly, so GITHUB_REF_NAME is already correct
      # and executionContext.ts falls back to it. Re-add the override if the
      # checkout below is ever pinned to another branch again.
      # --- Email reporting is DEPRECATED (Slack is the primary channel), so this
      #     is pinned off rather than reading vars.SEND_EMAIL. The reporter and the
      #     SMTP_*/EMAIL_* secrets stay wired up: set this to 'yes' to bring email
      #     back for a run. Recipients route per branch+trigger from
      #     config/notifications/recipients.csv, with EMAIL_TO as the fallback. ---
      SEND_EMAIL: 'no'
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      # --- Slack notification (opt-in): set the SEND_SLACK repo variable to
      #     'yes' and add the SLACK_BOT_TOKEN secret + SLACK_CHANNEL_ID variable.
      #
      #     SLACK_BOT_TOKEN + SLACK_CHANNEL_ID are the richer route: with both
      #     set the reporter posts via chat.postMessage, uploads the Allure report
      #     into the message's thread (webhooks cannot carry files) and then edits
      #     the message to link it from a button; the webhook is left unused. Bot
      #     scopes: chat:write, files:write.
      #
      #     On top of SEND_SLACK, slack/gate.ts only lets CI events through
      #     (SLACK_NOTIFY_EVENTS, default `schedule`): a push, a manual dispatch or
      #     a repository_dispatch run posts NOTHING. Set SLACK_NOTIFY_EVENTS to the
      #     event you are testing with to force a one-off post. ---
      SEND_SLACK: ${{ vars.SEND_SLACK || 'no' }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
      # Set the SLACK_ATTACH_ALLURE variable to 'no' for a summary-only channel.
      # Referenced here on purpose: repo variables are not environment variables
      # unless a workflow passes them through.
      SLACK_ATTACH_ALLURE: ${{ vars.SLACK_ATTACH_ALLURE }}
      SLACK_NOTIFY_EVENTS: ${{ vars.SLACK_NOTIFY_EVENTS }}
      # One report per suite, never merged — the header has to say which.
      SLACK_SUITE_NAME: ${{ inputs.suite_name || (matrix.suite == 'webpet' && 'WebPet' || 'User Journey') }}
      # Normally derived from the trigger ('Scheduled Dry Run' on a cron, 'Manual'
      # on a dispatch). A cross-repo dispatcher carries no caller context of its
      # own, so run_label lets it name its origin — web-pet's e2e-dev job passes
      # 'web-pet PR #<n>'. Null inputs (cron, push, repository_dispatch) fall
      # through to the variable, which keeps the old format-review override.
      SLACK_EXECUTION_LABEL: ${{ inputs.run_label || vars.SLACK_EXECUTION_LABEL }}
      # --- S3 artifact upload (opt-in): set the SEND_S3 repo variable to 'yes'
      #     and add the AWS_* secrets + S3_REPORT_BUCKET/AWS_REGION variables.
      #     With SEND_S3 unset, every AWS step below is skipped and the Slack
      #     message shows no S3 link. Uses a report bucket distinct from the
      #     app's MinIO S3_BUCKET. ---
      SEND_S3: ${{ vars.SEND_S3 || 'no' }}
      S3_REPORT_BUCKET: ${{ vars.S3_REPORT_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

    steps:
      # Without this, a missing password surfaces ~4 minutes later as an opaque
      # browser-login timeout in auth-setup, which then fails every test in the
      # run. Fail in seconds with the actual cause instead.
      - name: "Guard: login password secret present"
        run: |
          if [ -z "$PASSWORD" ]; then
            echo "::error::No login password configured — add a DEV_PASSWORD repository secret holding the dev-staging 'su' password. Settings > Secrets and variables > Actions."
            exit 1
          fi

      # No `ref:` — every trigger tests the ref that fired it, and a scheduled run
      # fires from the default branch, so the cron tests main. The old pin to
      # `dry-run` existed only because the code under test lived there while cron
      # could only fire from main; the two branches now hold the same code.
      - name: Checkout test suite
        uses: actions/checkout@v7
        with:
          # Full history + tags for webpet (0) — the relocation audit reads each
          # spec's pre-conversion form out of the webpet-lift-v1 tag, which a
          # shallow clone does not fetch.
          #
          # The condition is inverted on purpose. `suite == 'webpet' && 0 || 1`
          # ALWAYS yields 1, because GitHub treats 0 as falsy and collapses the
          # `&&` — which would silently shallow-clone webpet and downgrade the
          # relocation audit to a skipped warning. `||` returns its right operand
          # whatever its truthiness, so 0 has to sit last.
          fetch-depth: ${{ matrix.suite != 'webpet' && 1 || 0 }}

      - uses: actions/setup-node@v7
        with:
          # Keep in step with .nvmrc.
          node-version: 24

      - name: Set up Java (for Allure report generation)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install test-suite deps
        run: npm ci

      # Chromium-only suite (the firefox/webkit projects are commented out in
      # playwright.config.ts) and ubuntu-latest already ships Chromium's system
      # libraries — so --with-deps only added an apt-get, which hung on
      # unreachable Ubuntu mirrors for 15 min on 2026-08-19 and cancelled both
      # suites before a single test ran. Naming chromium also skips the unused
      # firefox/webkit downloads. The step timeout makes a future stall fail fast
      # instead of consuming the whole job budget.
      - name: Install Playwright browsers
        timeout-minutes: 6
        run: npx playwright install chromium

      # No database client to install: test-data cleanup is an API call over the
      # same session the tests use (src/utils/cleanup/cleanupRegistry.ts).

      # Fails in seconds on a runner-data problem that would otherwise show up as a
      # silently-skipped test: a spec whose testCaseId has no row, an enabled row no
      # spec claims, a category that disagrees with the spec's folder, an unknown
      # segment or module, or a JSON mirror that has drifted from its CSV.
      - name: Validate runner data and types
        if: matrix.suite != 'webpet'
        run: |
          npm run runner:check
          npm run typecheck

      # BLOCKING. Static analysis only (no app, no discovery): catches a spec
      # importing base.fixture — which would skip all 406 while reporting green
      # — plus orphaned/duplicate WP ids, drifted id maps and leaked journey
      # tags. None of those show up in a pass/fail column.
      - name: Validate webpet ids and imports
        if: matrix.suite == 'webpet'
        run: |
          npm run typecheck
          npm run lint
          npm run webpet:ids:check

      # Relocation gate — see webpet-e2e-local.yml for the rationale. Skipped
      # rather than failed when the tag is absent (shallow clone).
      - name: Validate webpet locator relocation
        if: matrix.suite == 'webpet'
        run: |
          if git rev-parse --verify webpet-lift-v1 >/dev/null 2>&1; then
            npm run webpet:audit
          else
            echo "::warning::webpet-lift-v1 tag not fetched — relocation audit skipped."
          fi

      # Blocking since Batch 15 (see webpet-e2e-local.yml for the full rationale):
      # the gate is fail-open, so a test with no runner row skips silently while
      # the run still reports green. With all 406 annotated and 0 rows structural,
      # any drift here is a real defect, not conversion churn.
      - name: Validate webpet runner data
        if: matrix.suite == 'webpet'
        run: npm run webpet:runner:check

      # Computed BEFORE the test run so the Playwright process — and thus the
      # Slack reporter (which posts in its onEnd, before the sync steps below) —
      # sees REPORT_S3_URL. The path is deterministic, so the link is valid once
      # the upload finishes seconds later. The suite segment keeps the two suites'
      # reports from overwriting each other.
      - name: Compute S3 report location
        if: env.SEND_S3 == 'yes'
        env:
          SEGMENT: ${{ matrix.suite == 'webpet' && 'webpet' || 'tiger-web' }}
        run: |
          PREFIX="automation-reports/${SEGMENT}/${GITHUB_REF_NAME}/${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ID}"
          echo "REPORT_S3_PREFIX=$PREFIX" >> "$GITHUB_ENV"
          echo "REPORT_S3_URL=https://${S3_REPORT_BUCKET}.s3.${AWS_REGION}.amazonaws.com/${PREFIX}/test-results/results.json" >> "$GITHUB_ENV"
          echo "ALLURE_REPORT_URL=https://${S3_REPORT_BUCKET}.s3.${AWS_REGION}.amazonaws.com/${PREFIX}/allure-report/index.html" >> "$GITHUB_ENV"

      - name: Run Playwright tests
        if: matrix.suite != 'webpet'
        env:
          # `inputs` covers workflow_dispatch AND workflow_call; both are empty for
          # push/repository_dispatch runs, which therefore behave exactly as before.
          GREP: ${{ inputs.grep }}
          TEST_SCOPE: ${{ inputs.scope }}
        run: |
          if [ -n "$GREP" ]; then
            echo "Filtering to: $GREP"
            npx playwright test --grep "$GREP"
          else
            npx playwright test
          fi

      # NOTE: no --reporter override — that would REPLACE the configured chain
      # and empty the html/allure artifacts uploaded below. The chain's JSON
      # reporter already writes artifacts/results/results.json for the diff.
      #
      # Default width is 2, matching playwright.config.ts. Read this before
      # trusting a red: this suite is NOT parallel-safe on dev — it mutates
      # shared dev data (test crews, employees, jobs, Ranch/Field inline edits,
      # user preferences), so at any width above 1 tests race each other and the
      # baseline diff below reports deltas that are contention, not regressions.
      # The committed baseline was captured serially. Dispatch with workers=1 for
      # a comparable run.
      - name: Run webpet Playwright tests
        if: matrix.suite == 'webpet'
        env:
          GREP: ${{ inputs.grep }}
          BATCH: ${{ inputs.batch }}
          WORKERS: ${{ inputs.workers }}
        run: |
          FILTER="$GREP"
          if [ -n "$BATCH" ]; then FILTER="@WPBatch$BATCH"; fi
          # Defaults to 2 when the input is unset or empty — `:-` substitutes on
          # empty as well as unset, which is the null-inputs case (cron, push).
          W="${WORKERS:-2}"
          if [ -z "$W" ]; then W=2; fi
          if [ "$W" != "1" ]; then
            echo "::warning::Running with $W workers — results are NOT comparable with the committed dev baseline (captured at 1)."
          fi
          echo "Workers: $W"
          if [ -n "$FILTER" ]; then
            echo "Filtering to: $FILTER"
            npx playwright test --project=webpet --workers="$W" --grep "$FILTER"
          else
            npx playwright test --project=webpet --workers="$W"
          fi

      # No-skip policy: a green run with 37 skips looks healthy and is not — each skip
      # is coverage nobody is watching. Playwright cannot fail on skip, so this gate
      # requires every skipped/didNotRun webpet test to carry an entry in
      # tests/webpet/skip-allowlist.json with a reason AND a ticket. An unlisted skip
      # fails the build; the allowlist is the burn-down list.
      #
      # `always()` so it still runs when tests failed — that is exactly when a serial
      # file silently drops its remaining tests as didNotRun.
      - name: Gate on unaccounted skips
        if: always() && matrix.suite == 'webpet'
        run: npm run webpet:skip-gate

      # Report-only: dev is a triage baseline for webpet, not a gate (its DB is not
      # the seeded DelLlano and the suite mutates dev data), so a delta here is
      # information rather than a failure.
      - name: Diff against the committed dev baseline
        if: always() && matrix.suite == 'webpet'
        continue-on-error: true
        run: |
          if [ -f src/data/webpet/baselines/dev.json ] && [ -f artifacts/results/results.json ]; then
            npm run webpet:diff -- src/data/webpet/baselines/dev.json artifacts/results/results.json
          else
            echo "::warning::No dev baseline manifest yet — see tests/webpet/README.md 'Baselines'."
          fi

      # Restores the previous run's trend data so the report's Trend/Graphs
      # widgets extend instead of resetting on every run. Keyed by run id (so
      # every run saves a fresh entry) with a suite- and branch-prefixed
      # restore-keys fallback (so it picks up the most recent entry for that
      # suite on that branch, and the two suites never share history).
      - name: Restore Allure history
        if: always()
        uses: actions/cache@v6
        with:
          path: artifacts/allure/report/history
          key: allure-history-${{ matrix.suite || 'journey' }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            allure-history-${{ matrix.suite || 'journey' }}-${{ github.ref_name }}-

      # The email reporter (when SEND_EMAIL=yes) already generates this from
      # artifacts/allure/results/ before attaching it, but regenerating here is
      # cheap and idempotent — it guarantees the artifact below exists even when
      # email is off, and regardless of whether the test step above failed.
      - name: Generate Allure report
        if: always()
        run: node scripts/report/allure-generate.js

      # Artifact names carry the suite: two uploads with the same name in one
      # orchestrated run collide.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suite == 'webpet' && 'webpet-playwright-report' || 'playwright-report' }}
          path: artifacts/html

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suite == 'webpet' && 'webpet-allure-report' || 'allure-report' }}
          path: artifacts/allure/report

      # Publish the raw test-results (traces, videos, screenshots, results.json)
      # to a public S3 bucket so a Slack reader can open them directly, without
      # logging into the Actions UI. Deterministic per-run prefix; bucket must
      # allow public read on automation-reports/* (bucket policy, not ACLs).
      - name: Configure AWS credentials
        if: always() && env.SEND_S3 == 'yes'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # The REMOTE key stays `test-results` on purpose: the S3 layout is a
      # published contract (REPORT_S3_URL above goes into the Slack message and
      # into people's bookmarks). Only the local source dir moved.
      - name: Upload test-results to S3
        if: always() && env.SEND_S3 == 'yes'
        run: aws s3 sync artifacts/results "s3://${S3_REPORT_BUCKET}/${REPORT_S3_PREFIX}/test-results" --no-progress

      # The whole folder, not just index.html: the Allure report is a static
      # site with relative asset links. ALLURE_REPORT_URL (computed above) is
      # what the Slack message links to.
      - name: Upload Allure report to S3
        if: always() && env.SEND_S3 == 'yes'
        run: aws s3 sync artifacts/allure/report "s3://${S3_REPORT_BUCKET}/${REPORT_S3_PREFIX}/allure-report" --no-progress
