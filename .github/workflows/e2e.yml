name: E2E

# Runs a Playwright suite against dev staging (app.ptdev.xyz); no app is booted here.
# `suite`: journey (tests/web, default) or webpet (tests/webpet, opt-in via WEBPET=1).
# The daily cron runs both, one after the other — they share dev data and webpet mutates it.
# This file must live on main: GitHub only fires `schedule:` from the default branch.
#
# Only the cron and manual dispatch run. `push` is commented out because a declared trigger
# leaves a skipped run entry per merge even when gated (run #967). To bring merge runs back,
# uncomment `push` AND set the CI_AUTO_TRIGGERS repo variable to `yes`. repository_dispatch
# and workflow_call stay declared but are refused by the `route` job unless that variable is `yes`.
on:
  schedule:
    # cron is UTC: IST − 5:30, two minutes early, off :00/:30 (GitHub's most contended minutes).
    # PARKED 15-minute grid: every declared cron leaves a run entry, so it is commented out.
    # To bring it back, uncomment it AND set SLOT_GRID to 'on' in the `route` job.
    # - cron: '28 9 * * *'   # 15:00 IST
    # - cron: '43 9 * * *'   # 15:15
    # - cron: '58 9 * * *'   # 15:30
    # - cron: '13 10 * * *'  # 15:45
    - cron: '28 10 * * *'    # 16:00 IST — the daily run
    # - cron: '43 10 * * *'  # 16:15
    # - cron: '58 10 * * *'  # 16:30
    # - cron: '13 11 * * *'  # 16:45
    # - cron: '28 11 * * *'  # 17:00
    # - cron: '43 11 * * *'  # 17:15
    # - cron: '58 11 * * *'  # 17:30
    # - cron: '13 12 * * *'  # 17:45
    # - cron: '28 12 * * *'  # 18:00
  # push:
  #   branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which suite to run. `both` mirrors the daily cron (journey then webpet, serial).'
        type: choice
        required: false
        default: journey
        options: [journey, client-feedback, webpet, both]
      grep:
        description: 'Only run tests matching this tag/pattern (journey: @JourneyA, @A1, @Smoke — webpet: employee, "Billing Center"). Blank = whole suite.'
        required: false
        default: ''
      scope:
        description: 'journey only. Customer scope from config/scopes/ (e.g. anthony-vineyards). Blank = no segment/module filtering.'
        required: false
        default: ''
      batch:
        description: 'webpet only. Conversion batch number, e.g. 01 — runs only @WPBatch<NN>. Takes precedence over grep.'
        required: false
        default: ''
      workers:
        description: 'Both suites. Defaults to 2. journey: 3 or 4 to measure a wider run. webpet: set 1 for a baseline-comparable run — the committed dev baseline only holds serially.'
        required: false
        default: '2'
      run_label:
        description: 'Overrides the Slack "how was this run started" label — a cross-repo dispatcher names its origin here (e.g. web-pet PR #566). Blank = derived from the trigger.'
        required: false
        default: ''
      browsers:
        description: 'journey only. `webkit` (Safari engine) or `msedge` runs the suite (or the grep) on that browser instead of Chromium; `cross-browser` runs the @CrossBrowser smoke on both.'
        type: choice
        required: false
        default: chromium
        options: [chromium, webkit, msedge, cross-browser]
  # Nothing calls this today; a caller would inherit its triggering event, which the Slack gate reads.
  workflow_call:
    inputs:
      suite:
        description: 'journey (default), client-feedback or webpet.'
        type: string
        required: false
        default: journey
      grep:
        type: string
        required: false
        default: ''
      scope:
        type: string
        required: false
        default: ''
      batch:
        type: string
        required: false
        default: ''
      workers:
        type: string
        required: false
        default: '1'
      suite_name:
        description: 'Overrides the Slack report header. Blank = derived from `suite`.'
        type: string
        required: false
        default: ''
      run_label:
        description: 'Overrides the Slack execution label — see the workflow_dispatch input of the same name.'
        type: string
        required: false
        default: ''
      browsers:
        description: '`chromium`, `webkit`, `msedge` or `cross-browser` — see the workflow_dispatch input of the same name.'
        type: string
        required: false
        default: chromium
  # Must match the event_type web-pet posts; a mismatch is accepted by GitHub and fires nothing.
  repository_dispatch:
    types:
      - run-playwright

# event_name and schedule are in the group so a dispatch cannot cancel the cron mid-suite.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.schedule }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate lives in a job because `vars` is not readable in `on:`. A green route job keeps
  # the run `success` when e2e is skipped, which web-pet's dispatch helper requires.
  route:
    name: Route dispatch
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - id: decide
        env:
          AUTO_TRIGGERS: ${{ vars.CI_AUTO_TRIGGERS }}
          EVENT: ${{ github.event_name }}
          RUN_LABEL: ${{ inputs.run_label || github.event.client_payload.run_label }}
          RUN_TIME_IST: ${{ vars.E2E_RUN_TIME_IST }}
          SCHEDULE: ${{ github.event.schedule }}
          # 'on' only while the cron grid is uncommented, or a set E2E_RUN_TIME_IST would skip the only run.
          SLOT_GRID: 'off'
        run: |
          if [[ "$EVENT" == "schedule" && "$SLOT_GRID" != "on" && -n "$RUN_TIME_IST" ]]; then
            echo "::warning::E2E_RUN_TIME_IST='$RUN_TIME_IST' is ignored while the cron grid is parked — the time is the one cron line in e2e.yml."
          fi
          if [[ "$EVENT" == "schedule" && "$SLOT_GRID" == "on" ]]; then
            # '43 10 * * *' -> 10:58 UTC -> +2 min early offset, +5:30 -> 16:30 IST.
            read -r m h _ <<< "$SCHEDULE"
            total=$(( (10#$h * 60 + 10#$m + 2 + 330) % 1440 ))
            slot=$(printf '%02d:%02d' $(( total / 60 )) $(( total % 60 )))
            wanted="${RUN_TIME_IST:-16:30}"
            if ! [[ "$wanted" =~ ^1[5-8]:(00|15|30|45)$ ]] || [[ "$wanted" > "18:00" ]]; then
              echo "::warning::E2E_RUN_TIME_IST='$wanted' is not a 15-minute slot between 15:00 and 18:00 IST — running at 16:30 instead."
              wanted="16:30"
            fi
            if [[ "$slot" != "$wanted" ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::notice::$slot IST slot — the suite runs at $wanted (E2E_RUN_TIME_IST)."
              exit 0
            fi
          fi
          if [[ "$EVENT" != "schedule" && "$EVENT" != "workflow_dispatch" && "$AUTO_TRIGGERS" != "yes" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::'$EVENT' is switched off. Set the CI_AUTO_TRIGGERS repo variable to 'yes' to let it run the suite. The cron and manual dispatch are unaffected."
          # dev deploys from main, so a web-pet merge dispatch would only retest what the cron covers.
          elif [[ "$RUN_LABEL" == "web-pet push "* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::'$RUN_LABEL' is a merge-to-main dispatch — the suite runs on PRs and the daily cron only."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: ${{ matrix.suite == 'webpet' && 'WebPet Playwright E2E (dev staging)' || matrix.suite == 'client-feedback' && 'Client Feedback Playwright E2E' || 'Playwright E2E' }}
    needs: route
    if: needs.route.outputs.skip != 'true'
    # Pinned: Playwright 1.58.2 has no Chromium build for ubuntu-latest (26.04 since 2026-10-30).
    runs-on: ubuntu-24.04

    strategy:
      # Never parallel: both suites use the same dev data and webpet mutates it.
      max-parallel: 1
      fail-fast: false
      matrix:
        # The client-feedback leg joins the cron only while the CF_SUITE_ENABLED repo variable is 'yes' (off by default).
        suite: ${{ fromJSON((github.event_name == 'schedule' || inputs.suite == 'both') && (vars.CF_SUITE_ENABLED == 'yes' && '["journey","client-feedback","webpet"]' || '["journey","webpet"]') || format('["{0}"]', inputs.suite || 'journey')) }}
    # A Journey B spec may legitimately wait out the 20-min import ceiling; every lower cap
    # (15/30/45/60) cancelled a red run before it could report. PW_GLOBAL_TIMEOUT_MS sits 5 min under.
    timeout-minutes: 90

    env:
      TEST_ENV: dev
      # 5 min under timeout-minutes, so Playwright ends a slow run and still reports;
      # a runner cancel produces no report, Slack post or upload.
      PW_GLOBAL_TIMEOUT_MS: '5100000'
      # A variable, not a secret: Actions masks every occurrence of a secret's value, and 'su'
      # mangled the whole log. The default is required — envLoader treats '' as set.
      USER_NAME: ${{ vars.DEV_USER_NAME || 'su' }}
      # No fallback on purpose: a stale PASSWORD secret once logged in to the wrong environment.
      PASSWORD: ${{ secrets.DEV_PASSWORD }}
      E2E_ADMIN_USER: ${{ vars.DEV_USER_NAME || 'su' }}
      E2E_ADMIN_PASSWORD: ${{ secrets.DEV_PASSWORD }}
      # WP-0408 (webpet employee.spec.ts) needs a real non-SU login; without it the test skips
      # and webpet:skip-gate fails the leg.
      WEBPET_NONSU_USER: ${{ secrets.WEBPET_NONSU_USER }}
      WEBPET_NONSU_PASSWORD: ${{ secrets.WEBPET_NONSU_PASSWORD }}
      # WP-0178 self-skips when unset (allowlisted); keeps employee barcodes out of the repo.
      SCAN_TIME_IN_EQUIV: ${{ vars.SCAN_TIME_IN_EQUIV }}
      SCAN_EMPLOYEE_BARCODE: ${{ vars.SCAN_EMPLOYEE_BARCODE }}
      WEBPET: ${{ matrix.suite == 'webpet' && '1' || '' }}
      # Journey B: Connectivity ▸ Import ▸ Internet. If another consumer steals relay envelopes
      # again (WEBPET-2222), 'single-folder' exercises the same office-side assertions.
      IMPORT_TRANSPORT: 'internet'
      # src/utils/api/writeGuard.ts — 'warn' records journey API writes; 'enforce' fails them. Never 'off'.
      UI_FIRST_GUARD: 'warn'
      # Per delivery: give up after IMPORT_STALL_MS with no progress, or at the ceiling.
      # Dev's import worker claims files 3–7 min after upload, sometimes 40.
      IMPORT_POLL_TIMEOUT_MS: '1200000'
      IMPORT_STALL_MS: '480000'
      # Stop a leg once a dev-wide outage has failed this many tests. Repo variables JOURNEY_MAX_FAILURES / CF_MAX_FAILURES
      # change it without a PR; webpet has no limit.
      MAX_FAILURES: ${{ matrix.suite == 'journey' && (vars.JOURNEY_MAX_FAILURES || '15') || matrix.suite == 'client-feedback' && (vars.CF_MAX_FAILURES || '15') || '' }}
      # OFFICE_TRANSPORT_SUBSTITUTE stays unset: it would turn a broken import green.
      # Email reporting is off (Slack is primary), but SMTP_* / EMAIL_* also feed UI-005
      # (tests/web/system/notification-email.spec.ts), so the secrets stay.
      SEND_EMAIL: 'no'
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      # Slack posts only when SEND_SLACK=yes and the event is in SLACK_NOTIFY_EVENTS (slack/gate.ts).
      # Bot token + channel id take precedence over the webhook and never fall back to it.
      SEND_SLACK: ${{ vars.SEND_SLACK || 'no' }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
      SLACK_ATTACH_ALLURE: ${{ vars.SLACK_ATTACH_ALLURE }}
      SLACK_NOTIFY_EVENTS: ${{ vars.SLACK_NOTIFY_EVENTS }}
      SLACK_SUITE_NAME: ${{ inputs.suite_name || (matrix.suite == 'webpet' && 'WebPet' || matrix.suite == 'client-feedback' && 'Client Feedback' || 'User Journey') }}
      # SLACK_EXECUTION_LABEL is exported by a step below; a job-level entry would shadow it.
      # src/utils/cleanup/residueSweep.ts: 0 disables, dry reports only. The age gate protects runs in progress.
      RESIDUE_SWEEP: ${{ vars.RESIDUE_SWEEP || '' }}
      RESIDUE_MIN_AGE_MIN: ${{ vars.RESIDUE_MIN_AGE_MIN || '120' }}

    steps:
      # Fails in seconds instead of as an opaque login timeout 4 minutes in.
      - name: "Guard: login password secret present"
        run: |
          if [ -z "$PASSWORD" ]; then
            echo "::error::No login password configured — add a DEV_PASSWORD repository secret holding the dev-staging 'su' password. Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Checkout test suite
        uses: actions/checkout@v7
        with:
          # webpet needs full history for the webpet-lift-v1 tag. Inverted on purpose:
          # `== 'webpet' && 0 || 1` always yields 1 because 0 is falsy.
          fetch-depth: ${{ matrix.suite != 'webpet' && 1 || 0 }}

      # Explicit label → dispatch payload → repo variable → the web-pet PR whose advisory job
      # is waiting on this run → blank (derived from the trigger). Never fails the run.
      - name: Resolve Slack execution label
        env:
          GH_TOKEN: ${{ secrets.WEBPET_READ_TOKEN || secrets.APP_REPO_TOKEN }}
          EXPLICIT_LABEL: ${{ inputs.run_label || github.event.client_payload.run_label || vars.SLACK_EXECUTION_LABEL }}
          WEBPET_REPO: orangeenterprisesinc/web-pet
        run: |
          LABEL="$EXPLICIT_LABEL"
          if [ -z "$LABEL" ] && [ -n "$GH_TOKEN" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            for RUN_ID in $(gh api "repos/$WEBPET_REPO/actions/workflows/ci.yml/runs?status=in_progress&per_page=10" \
                              --jq '.workflow_runs[].id' 2>/dev/null || true); do
              ACTIVE=$(gh api "repos/$WEBPET_REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
                         --jq '[.jobs[] | select(.name == "E2E on DEV (advisory)" and .status == "in_progress")] | length' \
                         2>/dev/null || echo 0)
              if [ "$ACTIVE" -gt 0 ]; then
                LABEL=$(gh api "repos/$WEBPET_REPO/actions/runs/$RUN_ID" \
                          --jq 'if (.pull_requests | length) > 0
                                then "web-pet PR #\(.pull_requests[0].number)"
                                else "web-pet \(.event) \(.head_branch)@\(.head_sha[0:7])" end' \
                          2>/dev/null || true)
                break
              fi
            done
          fi
          echo "SLACK_EXECUTION_LABEL=$LABEL" >> "$GITHUB_ENV"
          echo "Slack execution label: '${LABEL:-<derived from trigger>}'"

      - uses: actions/setup-node@v7
        with:
          node-version: 24  # keep in step with .nvmrc

      # Allure 2 (allure-commandline) runs on Java.
      - name: Set up Java (for Allure report generation)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install test-suite deps
        run: npm ci

      # Tests run inside Microsoft's Playwright image (scripts/run-in-docker.js, docs/DOCKER.md), so the
      # runner installs no browsers. Its own step so a registry stall fails fast.
      - name: Pull the Playwright image
        timeout-minutes: 6
        run: node scripts/run-in-docker.js --pull

      # A runner-data or type problem otherwise shows up as a silently skipped test.
      - name: Validate runner data and types
        if: matrix.suite != 'webpet'
        run: |
          npm run runner:check
          npm run typecheck

      # Catches what a pass/fail column cannot: a spec importing base.fixture (skips all 406
      # while green), orphaned/duplicate WP ids, locator relocation drift, missing runner rows.
      - name: Validate webpet
        if: matrix.suite == 'webpet'
        run: |
          npm run typecheck
          npm run lint
          npm run webpet:ids:check
          if git rev-parse --verify webpet-lift-v1 >/dev/null 2>&1; then
            npm run webpet:audit
          else
            echo "::warning::webpet-lift-v1 tag not fetched — relocation audit skipped."
          fi
          npm run webpet:runner:check

      # A queue, not a concurrency group: a group keeps one pending run and cancels the rest,
      # and a cancelled run reads as a failed check in web-pet. Two overlapping journey runs
      # drain each other's relay envelopes (2026-09-16). Waits only on lower run ids, so no deadlock.
      - name: Wait for the dev tenant
        if: matrix.suite != 'webpet'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            blocker=""
            for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/e2e.yml/runs?status=in_progress&per_page=50" \
                          --jq ".workflow_runs[] | select(.id < $GITHUB_RUN_ID) | .id"); do
              busy=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
                       --jq '[.jobs[] | select((.name | endswith("Playwright E2E")) and .status != "completed")] | length')
              if [ "${busy:-0}" -gt 0 ]; then blocker="$id"; break; fi
            done
            if [ -z "$blocker" ]; then
              echo "Dev tenant is free (waited $((attempt - 1)) x 30s)."
              exit 0
            fi
            echo "::notice::Waiting for run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$blocker to release the dev tenant ($attempt/60)."
            sleep 30
          done
          echo "::error::Gave up after 30 minutes waiting for $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$blocker."
          exit 1

      # No --reporter override: it would replace the configured chain and empty the reports below.
      # webpet is not parallel-safe on dev; its committed baseline was captured at 1 worker.
      - name: Run Playwright tests
        env:
          SUITE: ${{ matrix.suite }}
          GREP: ${{ inputs.grep }}
          TEST_SCOPE: ${{ matrix.suite != 'webpet' && inputs.scope || '' }}
          BATCH: ${{ inputs.batch }}
          WORKERS: ${{ inputs.workers }}
          BROWSERS: ${{ inputs.browsers }}
        run: |
          FILTER="$GREP"
          ARGS=()
          # webkit / msedge run the suite (or the grep) on that browser; cross-browser is the @CrossBrowser smoke on both.
          if [ "$SUITE" != "webpet" ]; then
            case "$BROWSERS" in
              webkit|msedge) ARGS+=(--project="$BROWSERS") ;;
              cross-browser) ARGS+=(--project=webkit --project=msedge); FILTER="${FILTER:-@CrossBrowser}" ;;
            esac
          fi
          if [ "$SUITE" = "webpet" ]; then
            if [ -n "$BATCH" ]; then FILTER="@WPBatch$BATCH"; fi
            W="${WORKERS:-2}"
            if [ "$W" != "1" ]; then
              echo "::warning::Running with $W workers — results are NOT comparable with the committed dev baseline (captured at 1)."
            fi
            echo "Workers: $W"
            ARGS+=(--project=webpet --workers="$W")
          else
            # playwright.config.ts reads WORKERS; empty (cron, push) means its default of 2.
            # The journey leg leaves tests/web/client-feedback to its own leg, so its runtime and MAX_FAILURES stay its own.
            if [ "$SUITE" = "client-feedback" ]; then ARGS+=(tests/web/client-feedback); else ARGS+=(--grep-invert @ClientFeedback); fi
            echo "Workers: ${WORKERS:-2 (default)}"
          fi
          if [ -n "$FILTER" ]; then
            echo "Filtering to: $FILTER"
            ARGS+=(--grep "$FILTER")
          fi
          node scripts/run-in-docker.js dev "${ARGS[@]}"

      # Every skipped/didNotRun webpet test needs an entry in tests/webpet/skip-allowlist.json.
      # always(): a failed serial file is exactly when the rest silently become didNotRun.
      - name: Gate on unaccounted skips
        if: always() && matrix.suite == 'webpet'
        run: npm run webpet:skip-gate

      # Report-only: dev is a triage baseline for webpet, not a gate.
      - name: Diff against the committed dev baseline
        if: always() && matrix.suite == 'webpet'
        continue-on-error: true
        run: |
          if [ -f src/data/webpet/baselines/dev.json ] && [ -f artifacts/results/results.json ]; then
            npm run webpet:diff -- src/data/webpet/baselines/dev.json artifacts/results/results.json
          else
            echo "::warning::No dev baseline manifest yet — see tests/webpet/README.md 'Baselines'."
          fi

      # Keyed per run, restored per suite + branch, so the Allure trend extends instead of resetting.
      - name: Restore Allure history
        if: always()
        uses: actions/cache@v6
        with:
          path: artifacts/allure/report/history
          key: allure-history-${{ matrix.suite || 'journey' }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            allure-history-${{ matrix.suite || 'journey' }}-${{ github.ref_name }}-

      - name: Generate Allure report
        if: always()
        run: node scripts/report/allure-generate.js

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suite == 'webpet' && 'webpet-playwright-report' || matrix.suite == 'client-feedback' && 'cf-playwright-report' || 'playwright-report' }}
          path: artifacts/html

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suite == 'webpet' && 'webpet-allure-report' || matrix.suite == 'client-feedback' && 'cf-allure-report' || 'allure-report' }}
          path: artifacts/allure/report

      # Fails when the sweeps found residue and deleted none (run 35589360814 went green on that).
      - name: Gate on cleanup health
        if: always()
        run: npm run cleanup:gate

      # The UI-first burn-down list; warn mode until the journey conversion is done.
      - name: Audit UI-first API writes
        if: always() && matrix.suite != 'webpet'
        run: npm run ui-first:audit

      - name: Upload residue-sweep summaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suite == 'webpet' && 'webpet-residue-sweep' || matrix.suite == 'client-feedback' && 'cf-residue-sweep' || 'residue-sweep' }}
          path: |
            artifacts/results/residue-sweep-*.json
            artifacts/results/fixture-reconcile-*.json
            artifacts/results/ui-first-w*.jsonl
          if-no-files-found: ignore
