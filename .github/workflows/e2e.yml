name: E2E

# Runs the Playwright suite against the DEV STAGING deployment (app.ptdev.xyz).
# No app is booted here — TEST_ENV=dev is pinned in the job env below, so the
# framework's env loading (env.dev + .env — see src/config/envLoader.ts) supplies
# BASE_URL/API_URL and USER_NAME, and the DEV_PASSWORD secret supplies the
# login password (dev-staging only — see the env block for why there is no
# fallback to a generic PASSWORD secret).
#
# Pinning TEST_ENV is load-bearing: without it envLoader falls back to 'local'
# and loads env.local, pointing the suite at http://localhost:3000 on a
# GitHub-hosted runner where nothing is listening.
#
# Need to run against a real localhost instead? See e2e-local.yml, which builds
# the app from a web-pet source checkout on a self-hosted Windows runner and runs
# the suite against http://localhost:3000.
#
# Runs twice daily on a schedule, on push to main, on manual dispatch, and on
# repository_dispatch (fired externally, e.g. when the app repo pushes code).
on:
  push:
    branches: [main]
  schedule:
    # IST is UTC+5:30 and GitHub's cron scheduler always runs in UTC — adjust
    # both entries if IST's offset ever changes. GitHub can also start a
    # scheduled run several minutes late under load; that's expected.
    - cron: '30 10 * * *'   # 4:00 PM IST
    - cron: '30 12 * * *'   # 6:00 PM IST
  workflow_dispatch:
  # Must match the `event_type` the sending repo's workflow actually posts
  # (its "Trigger Automation Repository" step sends {"event_type":"run-playwright"}
  # to POST /repos/orangeenterprisesinc/playwright-test-suite/dispatches) — a
  # mismatch here means GitHub accepts the dispatch but nothing fires, silently.
  repository_dispatch:
    types:
      - run-playwright

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Selects env.dev (BASE_URL=https://app.ptdev.xyz,
      # API_URL=https://api.ptdev.xyz/api — the API is a separate host from the
      # static SPA). Applies to every trigger above, so the repository_dispatch
      # the app repo fires also targets dev staging; localhost coverage lives in
      # e2e-local.yml.
      TEST_ENV: dev
      # USER_NAME comes from the DEV_USER_NAME repository *variable*, not a
      # secret. A login name is not a credential, and Actions masks every literal
      # occurrence of a secret's value — so storing a short value like 'su' as a
      # secret mangles unrelated words throughout the log (playwright-test-***ite,
      # allure-re***lts, Report ***ccessfully). Variables are not masked, so the
      # log stays readable. Set DEV_USER_NAME when dev staging's account changes;
      # leave it unset and the default below applies.
      #
      # The 'su' default is required, NOT redundant with env.dev's USER_NAME=su:
      # Actions exports a job-level env entry even when the expression resolves
      # empty, and envLoader only defers to the file value when the OS variable is
      # undefined — not when it is '' (src/config/envLoader.ts:98). Keep this
      # default in sync with env.dev.
      USER_NAME: ${{ vars.DEV_USER_NAME || 'su' }}
      #
      # DEV_PASSWORD is dev-staging only, with NO fallback — mirroring
      # LOCAL_PASSWORD in e2e-local.yml so the two environments stay visibly
      # separate. The previous `PW_PASSWORD || PASSWORD` chain silently picked up
      # a stale localhost PASSWORD secret and authenticated against the wrong
      # environment, which surfaced only as an opaque 20s waitForURL timeout in
      # auth-setup. An unset secret must fail loudly (see the guard step below)
      # rather than log in as somewhere else.
      PASSWORD: ${{ secrets.DEV_PASSWORD }}
      # --- Test-user cleanup via SQL. env.dev sets DB_CLEANUP=yes and
      #     DB_TRUSTED=no, which makes sqlClient.ts use the `mssql` driver rather
      #     than the sqlcmd CLI — a GitHub-hosted runner has neither a Windows
      #     identity to authenticate with nor sqlcmd installed. No SQLCMD_PATH
      #     needed; the driver arrives with npm ci.
      #
      #     DB_SERVER must be reachable from GitHub's runner IP ranges. The
      #     connectivity probe in global-setup.ts reports it up front rather than
      #     letting cleanup fail silently mid-run.
      #
      #     With DB_SERVER or DB_CLIENT unset, isDbCleanupEnabled() returns false
      #     and every cleanup call skips with a logged warning — the suite still
      #     passes, it just leaves its test users behind. ---
      DB_SERVER: ${{ secrets.DB_SERVER }}
      DB_CLIENT: ${{ vars.DB_CLIENT }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      # --- Email notification (opt-in): set the SEND_EMAIL repo variable to
      #     'yes' and add the SMTP_*/EMAIL_* secrets to activate it. With the
      #     variable unset the reporter logs one line and does nothing. ---
      SEND_EMAIL: ${{ vars.SEND_EMAIL || 'no' }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      # --- Slack notification (opt-in): set the SEND_SLACK repo variable to
      #     'yes' and add the SLACK_WEBHOOK_URL secret to activate it. With the
      #     variable unset the reporter logs one line and does nothing. ---
      SEND_SLACK: ${{ vars.SEND_SLACK || 'no' }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      # --- S3 artifact upload (opt-in): set the SEND_S3 repo variable to 'yes'
      #     and add the AWS_* secrets + S3_REPORT_BUCKET/AWS_REGION variables.
      #     With SEND_S3 unset, every AWS step below is skipped and the Slack
      #     message shows no S3 link. Uses a report bucket distinct from the
      #     app's MinIO S3_BUCKET. ---
      SEND_S3: ${{ vars.SEND_S3 || 'no' }}
      S3_REPORT_BUCKET: ${{ vars.S3_REPORT_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

    steps:
      # Without this, a missing password surfaces ~4 minutes later as an opaque
      # browser-login timeout in auth-setup, which then fails every test in the
      # run. Fail in seconds with the actual cause instead.
      - name: "Guard: login password secret present"
        run: |
          if [ -z "$PASSWORD" ]; then
            echo "::error::No login password configured — add a DEV_PASSWORD repository secret holding the dev-staging 'su' password. Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Checkout test suite
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java (for Allure report generation)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install test-suite deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # No sqlcmd install step: test-user cleanup goes through the `mssql` driver
      # (pure JS, comes from npm ci) because env.dev sets DB_TRUSTED=no. The
      # connectivity check lives in src/fixtures/global-setup.ts, which reuses the
      # same runSql() the tests use and emits a ::error:: annotation when the
      # database is unreachable — so a blocked port shows up on the run summary
      # without a separate step duplicating the connection logic here.

      # Computed BEFORE the test run so the Playwright process — and thus the
      # Slack reporter (which posts in its onEnd, before the sync step below) —
      # sees REPORT_S3_URL. The path is deterministic, so the link is valid once
      # the "Upload test-results to S3" step finishes seconds later.
      - name: Compute S3 report location
        if: env.SEND_S3 == 'yes'
        run: |
          PREFIX="automation-reports/tiger-web/${GITHUB_REF_NAME}/${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ID}"
          echo "REPORT_S3_PREFIX=$PREFIX" >> "$GITHUB_ENV"
          echo "REPORT_S3_URL=https://${S3_REPORT_BUCKET}.s3.${AWS_REGION}.amazonaws.com/${PREFIX}/test-results/results.json" >> "$GITHUB_ENV"

      - name: Run Playwright tests
        run: npx playwright test

      # Restores the previous run's trend data so the report's Trend/Graphs
      # widgets extend instead of resetting on every run. Keyed by run id (so
      # every run saves a fresh entry) with a branch-prefixed restore-keys
      # fallback (so it picks up the most recent entry on that branch).
      - name: Restore Allure history
        if: always()
        uses: actions/cache@v4
        with:
          path: allure-report/history
          key: allure-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            allure-history-${{ github.ref_name }}-

      # The email reporter (when SEND_EMAIL=yes) already generates this from
      # allure-results/ before attaching it, but regenerating here is cheap
      # and idempotent — it guarantees the artifact below exists even when
      # email is off, and regardless of whether the test step above failed.
      - name: Generate Allure report
        if: always()
        run: node scripts/generate-allure-report.js

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      # Publish the raw test-results (traces, videos, screenshots, results.json)
      # to a public S3 bucket so a Slack reader can open them directly, without
      # logging into the Actions UI. Deterministic per-run prefix; bucket must
      # allow public read on automation-reports/* (bucket policy, not ACLs).
      - name: Configure AWS credentials
        if: always() && env.SEND_S3 == 'yes'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload test-results to S3
        if: always() && env.SEND_S3 == 'yes'
        run: aws s3 sync test-results "s3://${S3_REPORT_BUCKET}/${REPORT_S3_PREFIX}/test-results" --no-progress
