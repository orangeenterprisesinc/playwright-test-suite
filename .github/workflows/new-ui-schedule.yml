name: New UI schedule

# A second daily run of main's E2E workflow (main has run the new UI since #159 merged feat/new-shell, 2026-11-11).
# It dispatches rather than declaring a second cron in e2e.yml, so the 16:00 IST run keeps its own entry.
on:
  schedule:
    - cron: '28 5 * * *'   # 11:00 IST
  workflow_dispatch:

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Run E2E on main (journey, client feedback, WebPet)
        run: gh workflow run e2e.yml --repo "$GITHUB_REPOSITORY" --ref main -f suite=both
        env:
          GH_TOKEN: ${{ github.token }}
